name = "abcgulf"
compatibility_date = "2026-01-01"
main = "worker.ts"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

# KV namespace binding:
# Once created in Cloudflare Dashboard (or via wrangler kv namespace create SITE_DATA),
# uncomment the lines below and set your real namespace id:
# [[kv_namespaces]]
# binding = "SITE_DATA"
# id = "your-kv-namespace-id"

# ADMIN_TOKEN is set via: npx wrangler secret put ADMIN_TOKEN
# (never stored in this file)
